<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMIGLIA - Build Your Empire</title>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@400;600;800&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --blood-red: #8B0000;
            --gold: #D4AF37;
            --cream: #F5E6D3;
            --black: #0A0A0A;
            --grey: #1A1A1A;
        }
        body {
            font-family: 'Crimson Text', serif;
            background: var(--black);
            color: var(--cream);
            overflow: hidden;
        }
        
        #shop {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(26,26,26,0.95);
            padding: 20px;
            border: 3px solid var(--gold);
            z-index: 1000;
            min-width: 300px;
        }
        
        #shop h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            margin-bottom: 15px;
        }
        
        .shop-item {
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            padding: 15px;
            margin: 10px 0;
            border: 2px solid var(--gold);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .shop-item:hover {
            background: linear-gradient(135deg, var(--gold), #9B7E2B);
            color: var(--black);
            transform: translateX(5px);
        }
        
        .shop-item h3 {
            font-family: 'Cinzel', serif;
            margin-bottom: 5px;
        }
        
        #hud {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(26,26,26,0.95);
            padding: 20px;
            border: 2px solid var(--gold);
            z-index: 1000;
        }
        
        #hud div {
            color: var(--cream);
            margin: 5px 0;
        }
        
        .placing-mode {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--blood-red);
            color: var(--gold);
            padding: 15px 30px;
            border: 2px solid var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <div id="shop">
        <h2>🏪 SHOP</h2>
        <div class="shop-item" onclick="buyBuilding('casino')">
            <h3>🎰 Harlem Casino</h3>
            <p>💰 Price: $25,000</p>
            <p>💵 Income: $500/h</p>
        </div>
    </div>
    
    <div id="hud">
        <div style="font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.2rem;">YOUR EMPIRE</div>
        <div>💰 Money: $<span id="money">50000</span></div>
        <div>🏢 Buildings: <span id="buildingCount">0</span></div>
    </div>
    
    <div class="placing-mode" id="placingMode">
        Click on map to place building
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script>
        let scene, camera, renderer, player;
        let playerMoney = 50000;
        let buildings = [];
        let casinoModel = null;
        let placingMode = false;
        let buildingToPlace = null;

        window.addEventListener('load', () => {
            initGame();
            loadCasinoModel();
        });

        function initGame() {
            const canvas = document.getElementById('gameCanvas');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            scene.fog = new THREE.Fog(0x0a0a0a, 50, 100);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 40, 30);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            const ambientLight = new THREE.AmbientLight(0xffd700, 0.3);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffd700, 0.8);
            directionalLight.position.set(10, 30, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            createCity();
            createPlayer();
            setupControls();
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function loadCasinoModel() {
            const loader = new THREE.GLTFLoader();
            loader.load(
                'https://cdn.jsdelivr.net/gh/Strawrfsa/famiglia-assets@main/harlem_casino.glb',
                (gltf) => {
                    casinoModel = gltf.scene;
                    casinoModel.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    console.log('Casino loaded!');
                },
                undefined,
                (error) => console.error('Casino load error:', error)
            );
        }

        function createCity() {
            // ORIGINAL GROUND TEXTURE
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, 0, 512, 512);
            
            for (let i = 0; i < 8000; i++) {
                const size = Math.random() * 2 + 1;
                const brightness = Math.floor(Math.random() * 40) + 20;
                ctx.fillStyle = `rgba(${brightness}, ${brightness}, ${brightness}, ${Math.random() * 0.4})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, size, size);
            }
            
            ctx.strokeStyle = 'rgba(10, 10, 10, 0.6)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 40; i++) {
                ctx.beginPath();
                const startX = Math.random() * 512;
                const startY = Math.random() * 512;
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX + (Math.random() - 0.5) * 100, startY + (Math.random() - 0.5) * 100);
                ctx.stroke();
            }
            
            for (let i = 0; i < 100; i++) {
                ctx.fillStyle = `rgba(15, 10, 5, ${Math.random() * 0.3})`;
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 15, 0, Math.PI * 2);
                ctx.fill();
            }
            
            const groundTexture = new THREE.CanvasTexture(canvas);
            groundTexture.wrapS = THREE.RepeatWrapping;
            groundTexture.wrapT = THREE.RepeatWrapping;
            groundTexture.repeat.set(4, 4);
            
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(80, 80, 30, 30),
                new THREE.MeshStandardMaterial({ 
                    map: groundTexture,
                    roughness: 0.95,
                    metalness: 0.05
                })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            ground.name = 'ground';
            scene.add(ground);

            // STREETS
            const streetCanvas = document.createElement('canvas');
            streetCanvas.width = 256;
            streetCanvas.height = 256;
            const streetCtx = streetCanvas.getContext('2d');
            
            streetCtx.fillStyle = '#1a1a1a';
            streetCtx.fillRect(0, 0, 256, 256);
            
            for (let i = 0; i < 3000; i++) {
                const brightness = Math.floor(Math.random() * 30) + 10;
                streetCtx.fillStyle = `rgba(${brightness}, ${brightness}, ${brightness}, ${Math.random() * 0.5})`;
                streetCtx.fillRect(Math.random() * 256, Math.random() * 256, Math.random() * 2, Math.random() * 2);
            }
            
            const streetTexture = new THREE.CanvasTexture(streetCanvas);
            const streetMat = new THREE.MeshStandardMaterial({ map: streetTexture, roughness: 0.85 });
            
            for (let i = -2; i <= 2; i++) {
                const street = new THREE.Mesh(new THREE.PlaneGeometry(80, 4), streetMat);
                street.rotation.x = -Math.PI / 2;
                street.position.set(0, 0.02, i * 15);
                scene.add(street);
            }

            // LAMP POSTS
            for (let x = -35; x <= 35; x += 18) {
                for (let z = -35; z <= 35; z += 18) {
                    if (Math.random() > 0.3) {
                        const lamp = new THREE.Mesh(
                            new THREE.CylinderGeometry(0.12, 0.18, 10, 8),
                            new THREE.MeshStandardMaterial({ color: 0x2a2a2a })
                        );
                        lamp.position.set(x, 5, z);
                        scene.add(lamp);

                        const light = new THREE.PointLight(0xffd700, 1.5, 22);
                        light.position.set(x, 10, z);
                        scene.add(light);
                    }
                }
            }

            // CARS
            const carColors = [0x8B0000, 0x000000, 0x2F4F4F, 0xC0C0C0];
            for (let i = 0; i < 6; i++) {
                const car = new THREE.Group();
                const carMat = new THREE.MeshStandardMaterial({ 
                    color: carColors[Math.floor(Math.random() * carColors.length)],
                    metalness: 0.95,
                    roughness: 0.1
                });
                
                const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 4), carMat);
                body.position.y = 0.4;
                car.add(body);
                
                const roof = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.7, 2.2), carMat);
                roof.position.set(0, 1.15, -0.3);
                car.add(roof);

                car.position.set(
                    (Math.random() - 0.5) * 70,
                    0,
                    (Math.random() - 0.5) * 70
                );
                car.rotation.y = Math.random() * Math.PI * 2;
                scene.add(car);
            }
        }

        function createPlayer() {
            player = new THREE.Group();
            
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.4, 0.5, 1.2, 8),
                new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
            );
            body.position.y = 0.6;
            player.add(body);

            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xFFDBB5 })
            );
            head.position.y = 1.5;
            player.add(head);

            const hat = new THREE.Mesh(
                new THREE.CylinderGeometry(0.25, 0.3, 0.3, 16),
                new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
            );
            hat.position.y = 1.85;
            player.add(hat);

            player.position.set(0, 0, 0);
            scene.add(player);
        }

        function buyBuilding(type) {
            if (type === 'casino') {
                if (playerMoney >= 25000) {
                    if (!casinoModel) {
                        alert('Casino model is still loading...');
                        return;
                    }
                    placingMode = true;
                    buildingToPlace = 'casino';
                    document.getElementById('placingMode').style.display = 'block';
                } else {
                    alert('Not enough money! Need $25,000');
                }
            }
        }

        function setupControls() {
            const canvas = document.getElementById('gameCanvas');
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            canvas.addEventListener('click', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);

                if (placingMode) {
                    const intersects = raycaster.intersectObjects(scene.children.filter(obj => obj.name === 'ground'));
                    
                    if (intersects.length > 0) {
                        const point = intersects[0].point;
                        placeBuilding(point.x, point.z);
                    }
                }
            });
        }

        function placeBuilding(x, z) {
            if (buildingToPlace === 'casino' && casinoModel) {
                const building = casinoModel.clone();
                building.position.set(x, 0, z);
                building.scale.set(0.5, 0.5, 0.5); // SMALLER SCALE!
                scene.add(building);
                
                buildings.push(building);
                playerMoney -= 25000;
                
                document.getElementById('money').textContent = playerMoney.toLocaleString();
                document.getElementById('buildingCount').textContent = buildings.length;
                
                placingMode = false;
                buildingToPlace = null;
                document.getElementById('placingMode').style.display = 'none';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            if (player) {
                player.position.y = Math.sin(time * 2) * 0.05;
            }
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
